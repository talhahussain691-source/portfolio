    <rect x="0" y="0" width="50" height="16"/>
    <rect x="17" y="0" width="16" height="80"/>
    <rect x="33" y="33" width="31" height="14"/>
    <rect x="64" y="0" width="16" height="80"/>
  </g>
  <rect x="86" y="66" width="14" height="14" fill="#ff4a1c"/>
</svg>
